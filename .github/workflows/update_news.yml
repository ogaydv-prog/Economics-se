name: Update Weekly Economics News

on:
  schedule:
    # Запуск каждую среду в 05:00 UTC (10:00 по времени Астаны)
    - cron: '0 5 * * 3'
  workflow_dispatch: # Возможность ручного запуска из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run news fetcher script
      run: python fetch_news.py

    - name: Commit and push updated news JSON
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add news_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Economics News for Wednesday" && git push)

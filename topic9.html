<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 9 | Economics (SE)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Логотип прижат к крайнему левому краю на уровне заголовка */
        .top-left-logo {
            position: absolute;
            top: 22px;
            left: 20px;
            width: 56px;
            height: 56px;
            object-fit: contain;
            z-index: 10;
        }

        /* Кнопка возврата симметрично прижата к крайнему правому краю на той же линии */
        .back-button {
            position: absolute;
            top: 30px;
            right: 20px;
            text-decoration: none;
            background-color: #001e50;
            color: white;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 30, 80, 0.15);
            white-space: nowrap;
            z-index: 10;
        }

        .back-button:hover {
            background-color: #003380;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 30, 80, 0.25);
        }

        /* Заголовок и подзаголовок по центру с боковыми отступами под логотип и кнопку */
        .header-titles {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 0 180px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #001e50;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #555555;
            line-height: 1.45;
            max-width: 780px;
            margin: 0 auto;
        }

        /* Контейнер карточек — центрирование по высоте экрана */
        .grid-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 18px;
            max-width: 1450px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            padding: 20px 0;
        }

        /* Карточка ресурсов (185x300px) */
        .card {
            display: block;
            text-decoration: none;
            background: #ffffff;
            border: 2px solid #001e50;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 30, 80, 0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 185px;
            height: 300px;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .card img {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            object-fit: fill !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Усиленный эффект при наведении: утолщенная рамка, подъём и яркая подсветка */
        .card:hover {
            transform: translateY(-10px) scale(1.04);
            border: 3px solid #0284c7;
            box-shadow: 0 12px 28px rgba(2, 132, 199, 0.35), inset 0 0 10px rgba(2, 132, 199, 0.15);
        }

        footer {
            margin-top: auto;
            font-size: 14px;
            color: #718096;
            padding-top: 30px;
            padding-bottom: 20px;
            text-align: center;
            line-height: 1.6;
        }

        /* Адаптивность для планшетов и средних экранов */
        @media (max-width: 1250px) {
            .grid-container {
                flex-wrap: wrap;
                gap: 16px;
            }
        }

        @media (max-width: 960px) {
            .header-titles {
                padding: 0 150px;
            }

            h1 {
                font-size: 24px;
            }
        }

        /* Адаптивность для смартфонов: логотип и кнопка по центру, карточки в 2 колонки */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px;
            }

            .top-left-logo {
                position: static;
                display: block;
                margin: 0 auto 10px auto;
                width: 52px;
                height: 52px;
            }

            .back-button {
                position: static;
                display: inline-block;
                margin: 0 auto 14px auto;
                padding: 8px 16px;
                font-size: 13px;
            }

            .header-titles {
                margin-top: 0;
                margin-bottom: 16px;
                padding: 0 8px;
            }

            h1 {
                font-size: 21px;
            }

            .subtitle {
                font-size: 13px;
                line-height: 1.4;
            }

            .grid-container {
                display: grid;
                grid-template-columns: repeat(2, minmax(140px, 165px));
                justify-content: center;
                gap: 14px;
                margin: 8px auto;
                padding: 10px 0 24px;
                width: 100%;
            }

            .card {
                width: 100%;
                height: auto;
                aspect-ratio: 185 / 300;
            }

            .card:hover {
                transform: translateY(-4px) scale(1.02);
            }

            footer {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Логотип AlmaU в крайнем левом верхнем углу на уровне заголовка -->
    <img src="https://ogaydv-prog.github.io/economics-se/almau.jpg" alt="AlmaU Logo" class="top-left-logo" onerror="this.onerror=null; this.src='./almau.jpg';">

    <!-- Кнопка возврата симметрично в крайнем правом верхнем углу -->
    <a href="topics.html" class="back-button">← Back to Topics</a>

    <!-- Заголовок и подзаголовок -->
    <div class="header-titles">
        <h1>Topic 9: Measuring the Cost of Living</h1>
        <p class="subtitle">
            Select a learning resource below: presentation, inflation simulators, lab task, or video lecture.
        </p>
    </div>

    <!-- Основная сетка ресурсов (посередине) -->
    <main class="grid-container">
        <!-- 1. Лекция -->
        <a href="cpi-lecture9-pro-pe.html" class="card" title="Lecture Notes">
            <img src="https://ogaydv-prog.github.io/economics-se/pic-lecture9-pe.png" alt="Lecture Notes" onerror="this.onerror=null; this.src='./pic-lecture9-pe.png';">
        </a>

        <!-- 2. Презентация Canva -->
        <a href="https://canva.link/sqo0h6oo8x0mp9c" target="_blank" rel="noopener noreferrer" class="card" title="Presentation">
            <img src="https://ogaydv-prog.github.io/economics-se/pic-preza9-pe.png" alt="Presentation" onerror="this.onerror=null; this.src='./pic-preza9-pe.png';">
        </a>

        <!-- 3. Симулятор ИПЦ / CPI -->
        <a href="sim-cpi-pe.html" class="card" title="CPI Simulator">
            <img src="https://ogaydv-prog.github.io/economics-se/pic-cpi-pe.png" alt="CPI Simulator" onerror="this.onerror=null; this.src='./pic-cpi-pe.png';">
        </a>

        <!-- 4. Симулятор Альтернативных Индексов (Биг-Мак и др.) -->
        <a href="sim-big-mc-pe-pro.html" class="card" title="Alternative Inflation Indices">
            <img src="https://ogaydv-prog.github.io/economics-se/pic-big-mc-pe.png" alt="Alternative Inflation Indices" onerror="this.onerror=null; this.src='./pic-big-mc-pe.png';">
        </a>

        <!-- 5. Лабораторная работа (Task: Hungry Planet PDF) -->
        <a href="https://static1.squarespace.com/static/53e438aae4b08bfde27ada2b/t/56e8d090b09f9515320473db/1458098539861/hungry-planet.pdf" target="_blank" rel="noopener noreferrer" class="card" title="CPI Lab Task: Hungry Planet">
            <img src="https://ogaydv-prog.github.io/economics-se/pic-cpi-task-pe.png" alt="CPI Lab Task" onerror="this.onerror=null; this.src='./pic-cpi-task-pe.png';">
        </a>

        <!-- 6. Видеолекция -->
        <a href="https://www.youtube.com/watch?v=JW7IQ45_up8&list=PL11ADD17785C9C9A4&index=6" target="_blank" rel="noopener noreferrer" class="card" title="Video Lecture">
            <img src="https://ogaydv-prog.github.io/economics-se/pic-video9-pe.png" alt="Video Lecture" onerror="this.onerror=null; this.src='./pic-video9-pe.png';">
        </a>
    </main>

    <footer>
        <p>Developed for Software Engineering Students | Economics</p>
        <p>© Almaty Management University | School of Digital Technologies & Economics</p>
    </footer>

</body>
</html>
